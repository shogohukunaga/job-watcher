name: 新着案件チェック

on:
  schedule:
    - cron: "*/10 * * * *" # 10分ごと（GitHubの混雑状況で数分〜十数分遅れることがあります）
  workflow_dispatch: # Actions 画面の「Run workflow」から手動実行もできる
    inputs:
      test:
        description: "テストメールを送る件数（0なら通常のチェック）"
        default: "0"

permissions:
  contents: write # state/seen.json をコミットするため

concurrency:
  group: job-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 新着チェック
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROFILE_TEXT: ${{ secrets.PROFILE_TEXT }}
          PROPOSAL_TEMPLATE: ${{ secrets.PROPOSAL_TEMPLATE }}
          PYTHONIOENCODING: utf-8
          TEST_COUNT: ${{ github.event.inputs.test || '0' }}
        run: |
          if [ "$TEST_COUNT" != "0" ]; then
            python watcher.py --test "$TEST_COUNT"
          else
            python watcher.py
          fi

      - name: 既読リストを保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "既読リストを更新"
            git push
          fi
